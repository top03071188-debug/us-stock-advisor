# config/public_allowlist.yaml — 공개 허용 목록 단일 정의 (기획서 2.2.3) [고정]
#
# scripts/build_public_data.py 와 scripts/check_commit_scope.py 가 이 파일 하나를 읽는다.
# "허용된 것만 통과"가 아니라 "금지 키가 하나라도 있으면 실패"로 검사한다.
# (필드를 새로 추가할 때 허용 목록 갱신을 잊어도 조용히 새지 않게 하기 위해서다.)


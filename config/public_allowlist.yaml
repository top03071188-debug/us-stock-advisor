# config/public_allowlist.yaml — 공개 허용 목록 단일 정의 (기획서 2.2.3) [고정]
#
# scripts/build_public_data.py 와 scripts/check_commit_scope.py 가 이 파일 하나를 읽는다.
# "허용된 것만 통과"가 아니라 "금지 키가 하나라도 있으면 실패"로 검사한다.
# (필드를 새로 추가할 때 허용 목록 갱신을 잊어도 조용히 새지 않게 하기 위해서다.)

version: 1
description: 공개 Pages 산출물·저장소 커밋에 넣어도 되는 필드/경로

allow:
  # 점수·등급·판정
  - score
  - entry_score
  - components
  - investor_scores
  - grade
  - confidence
  - conflict
  - status
  - type
  - intent
  - quant_intent
  - track
  - label
  # 밸류에이션·지표(파생값)
  - valuation
  - iv_low
  - iv_median
  - iv_high
  - margin
  - price
  - dma50
  - dma200
  - rsi14
  - pct_b
  - atr14
  - atr_pct
  - valuation_suspended
  - sector
  - weight
  # 요약·메타데이터
  - thesis_ko
  - one_line_ko
  - summary_ko
  - note
  - regime
  - generated_at
  - as_of
  - data_cutoff_at
  - signal_published_at
  - order_cutoff_at
  - completed_at
  - params_version
  - snapshot_id
  - schema_version
  - code_commit
  - params_hash
  - quote_sha256
  - quote_verified
  - quote_chars
  # 뉴스는 제목·매체·시각·링크만
  - headline
  - title
  - source
  - published_at
  - url
  - news_state
  - durability
  - impact
  - severity
  # 근거 메타(값이 아니라 종류·시각·링크)
  - evidence
  - type
  - metric
  - value_kind
  - filed_date
  - available_at
  - form
  - accession
  - items
  # 성적표 요약
  - agreement
  - direction
  - band
  - drawdown
  - timing
  - total
  - win_rate
  - excess
  - n_eff
  - cagr
  - mdd
  - sharpe
  - exposure
  - folds
  - horizon_td
  - eligible
  - truncated

deny_keys:                       # 하나라도 있으면 커밋·배포 실패 [고정]
  - quote
  - evidence_quote
  - body
  - body_excerpt_1500
  - raw_open
  - raw_high
  - raw_low
  - raw_close
  - sadj_open
  - sadj_high
  - sadj_low
  - sadj_close
  - adj_close
  - ohlc
  - volume_series
  - shares
  - shares_held
  - avg_cost
  - account
  - holdings
  - cash_balance
  - total_asset
  - auth
  - auth_json
  - api_key
  - secret

deny_paths:                      # 커밋 금지 경로(부분 일치)
  - data/raw/
  - data/debate/
  - data/snapshots/
  - data/corpus/
  - data/cache/
  - local/
  - .env

deny_patterns:                   # 값 안에서 탐지할 패턴(이메일·토큰류)
  - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
  - "github_pat_[A-Za-z0-9_]{20,}"
  - "ghp_[A-Za-z0-9]{20,}"

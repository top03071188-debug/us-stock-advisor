# config/veto_rules.yaml — 리스크 가드 12종 (기획서 3.6) [고정]
#
# Veto 는 신호를 삭제하지 않고 `veto[]` 에 남긴다. 왜 차단됐는지가 쌓여야 규칙을 고칠 수 있다.
# `blocking: true` 인 규칙은 신규 매수를 막고, `blocking: false` 는 경고만 남긴다(예: V09 는
# 보유 종목의 매도 신호로 작동하며 신규 매수도 함께 막는다 — 기본은 true).
# 그룹: hard_gate(구조·상장) / disclosure(공시·뉴스) / liquidity / macro / limit(비중) /
#       thesis(논리 훼손) / data(데이터 품질) / evidence(근거 부족)
version: veto_rules_v001
created_at: "2026-11-20"
source: "기획서 v1.3.1 §3.6"

rules:
  - code: V01
    name: EARNINGS_WINDOW
    group: disclosure
    blocking: true
    message_ko: "실적 발표 임박 — 신규 매수 보류"
    release_ko: "발표 후 2거래일"
    params: {days_before: 2, days_after: 1}
  - code: V02
    name: DATA_STALE
    group: data
    blocking: true
    message_ko: "데이터 지연 — 판단 보류"
    release_ko: "데이터 갱신"
    params: {max_lag_business_days: 2}
  - code: V03
    name: STRUCTURAL_8K
    group: hard_gate
    blocking: true
    message_ko: "구조적 악재 공시 — 매수 차단"
    release_ko: "공시 내용 확인 후 수동 해제"
    params:
      items: ["3.01", "4.02", "2.06", "5.02"]
      verified_only: ["5.02"]        # 5.02 는 원문으로 확인된 CEO/CFO 사임·해임만
  - code: V04
    name: GOING_CONCERN
    group: hard_gate
    blocking: true
    message_ko: "존속 불확실 — 워치리스트 제외"
    release_ko: "다음 연간보고서"
    params: {}
  - code: V05
    name: LIQUIDITY
    group: liquidity
    blocking: true
    message_ko: "유동성 부족"
    release_ko: "회복 시"
    params: {min_adv20_usd: 20_000_000}
  - code: V06
    name: MACRO_EXTREME
    group: macro
    blocking: true
    message_ko: "시장 급변 — 신규 매수 전면 중단"
    release_ko: "지표 안정 3일"
    params: {vix_max: 35.0, hy_oas_max_bp: 700.0}
  - code: V07
    name: SECTOR_CAP
    group: limit
    blocking: true
    message_ko: "섹터 집중 한도"
    release_ko: "비중 조정"
    params: {max_sector_weight: 0.25}
  - code: V08
    name: POSITION_CAP
    group: limit
    blocking: true
    message_ko: "종목 집중 한도"
    release_ko: "조정"
    params: {max_position_weight: 0.05}
  - code: V09
    name: THESIS_BREAK
    group: thesis
    blocking: true
    message_ko: "매수 논리 훼손"
    release_ko: "논리 재확인"
    params: {structural_risk_exit: 70}
  - code: V10
    name: SPLIT_ANOMALY
    group: data
    blocking: true
    message_ko: "가격 이상 — 확인 필요"
    release_ko: "데이터 검증"
    params: {max_abs_daily_return: 0.40}
  - code: V11
    name: NEWS_INJECTION
    group: disclosure
    blocking: true
    message_ko: "뉴스 신뢰 불가 — 판독 제외"
    release_ko: "수동 검토"
    params: {}
  - code: V12
    name: EVIDENCE_MISSING
    group: evidence
    blocking: true
    message_ko: "근거 부족 — 신호 미발행"
    release_ko: "재수집"
    params:
      required_evidence_types: ["fundamental", "sec_filing"]

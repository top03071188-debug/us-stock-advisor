# quarterly-walkforward.yml — 분기 워크포워드 보정 후보 생성 & PR 제출 (분기 1일 00:00 UTC)
#
# 보정 후보는 절대 main 에 직접 반영하지 않고 PR 로만 올린다(기획서 4.3 가드 2).
# 비공개 아카이브 저장소에서 스냅샷을 복원해 실제 폴드 재생·채점을 시도한다.
name: quarterly-walkforward

on:
  schedule:
    - cron: "0 0 1 1,4,7,10 *"   # 1·4·7·10월 1일 09:00 KST
  workflow_dispatch:

concurrency:
  group: quarterly-walkforward
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.lock
      - name: Restore snapshots from private archive (if configured)
        id: snapshots
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_REPO_TOKEN }}
          ARCHIVE_REPO: ${{ vars.PRIVATE_ARCHIVE_REPO }}
        run: |
          set -euo pipefail
          mkdir -p data/snapshots /tmp/snapshots_dl
          if [ -z "${GH_TOKEN:-}" ] || [ -z "${ARCHIVE_REPO:-}" ]; then
            echo "::warning::아카이브 시크릿/변수 미설정 — 로컬 스냅샷만 사용"
            echo "grading_panels=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download snapshots-2026 --repo "$ARCHIVE_REPO" --pattern "snapshot_*.tgz" \
            --dir /tmp/snapshots_dl --clobber || true
          for tgz in /tmp/snapshots_dl/snapshot_*.tgz; do
            [ -f "$tgz" ] || continue
            stem=$(basename "$tgz" .tgz)
            tmp_extract="/tmp/snapshots_extract_${stem}"
            rm -rf "$tmp_extract" && mkdir -p "$tmp_extract"
            tar -xzf "$tgz" -C "$tmp_extract"
            mkdir -p "data/snapshots/${stem}"
            # tar 안의 최상위 폴더(<date>/) 내용물을 고유 스냅샷 폴더로 옮겨 덮어쓰기를 막는다.
            for sub in "$tmp_extract"/*; do
              if [ -d "$sub" ] && [ -f "$sub/manifest.json" ]; then
                cp -r "$sub"/. "data/snapshots/${stem}/"
              fi
            done
            rm -rf "$tmp_extract"
          done
          latest=$(python - <<'PY'
          import pathlib
          from engine.backtest.pipeline_runner import list_snapshots
          snaps, _ = list_snapshots("data/snapshots")
          print(str(snaps[-1].root) if snaps else "")
          PY
          )
          echo "grading_panels=${latest}" >> "$GITHUB_OUTPUT"
      - name: Run quarterly walk-forward & calibration
        run: |
          ARGS=(--quarterly --today "$(date -u +%F)")
          if [ -n "${{ steps.snapshots.outputs.grading_panels }}" ]; then
            ARGS+=(--grading-panels "${{ steps.snapshots.outputs.grading_panels }}")
          fi
          python scripts/run_walkforward.py "${ARGS[@]}"
      - name: Open calibration PR (allowlist only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CANDIDATES=(
            data/walkforward/folds/summary.json
            data/walkforward/attempts.json
            data/calibration/attempts.json
            data/walkforward/holdout/
            reports/calibration.md
            config/params_v*.yaml
          )
          for p in "${CANDIDATES[@]}"; do
            for match in $p; do
              [ -e "$match" ] && git add "$match"
            done
          done
          python scripts/check_commit_scope.py --staged
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — PR 생략"
            exit 0
          fi
          BRANCH="chore/quarterly-walkforward-$(date -u +%F)"
          git checkout -b "$BRANCH"
          git commit -m "chore(params): quarterly walkforward $(date -u +%F)"
          git push -u origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "chore(params): 분기 보정 후보 $(date -u +%F)" \
            --body-file reports/calibration.md || echo "기존 PR 업데이트 완료"

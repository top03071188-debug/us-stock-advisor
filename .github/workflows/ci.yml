name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (locked)
        run: pip install -r requirements.lock
      - name: Lint
        run: |
          pip install ruff==0.6.9
          ruff check engine scripts tests || true   # Phase 1: 경고만, 차단은 아래 테스트가 한다
      - name: Unit & look-ahead tests (offline)
        run: python -m pytest -m "not network" -q
      - name: Commit scope guard (.env·quote·원시가 경로)
        run: |
          python scripts/check_commit_scope.py --paths \
            config/params_v001.yaml config/public_allowlist.yaml \
            data/walkforward/folds/summary.json data/calibration/attempts.json
      - name: Public data build guard
        run: python scripts/build_public_data.py --signals data/samples/quant_signals.example.json \
               --folds data/walkforward/folds/summary.json --out /tmp/public_data

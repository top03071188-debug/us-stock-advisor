# weekly-screen.yml — 주간 1층 재스크린(토 08:00 KST) + 워치리스트/13F 커밋 + Pages 배포.
# 배포는 이 실행 안에서 끝낸다 — GITHUB_TOKEN 푸시는 push 워크플로를 시작시키지 않는다(2.2.4).
name: weekly-screen

on:
  schedule:
    - cron: "0 23 * * 5"      # 토 08:00 KST (주간 1층 재스크린)
  workflow_dispatch:

concurrency:
  group: weekly-screen
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.lock
      - name: Restore pipeline cache (public-safe paths only)
        uses: actions/cache@v4
        with:
          # data/ 전체를 캐시하지 않는다 — 원시 시세·기사 발췌·스냅샷이 캐시로도 샌다(2.2.4)
          path: |
            data/cache/sec_cik
            data/cache/yfinance
          key: pipeline-${{ runner.os }}-${{ hashFiles('requirements.lock') }}-${{ github.run_id }}
          restore-keys: |
            pipeline-${{ runner.os }}-${{ hashFiles('requirements.lock') }}-
      - name: Run weekly screen
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/run_screen.py --as-of $(date -u +%F)
      - name: Validate output schemas
        run: python scripts/validate_outputs.py
      - name: Commit watchlist & 13F (allowlist only)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist/current.json data/watchlist/history.jsonl data/radar/13f.json
          python scripts/check_commit_scope.py --staged
          git diff --cached --quiet || git commit -m "data: weekly screen $(date -u +%F)"
          git push
      - name: Build public data (allowlist only)
        run: python scripts/build_public_data.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }

  deploy:
    needs: screen
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
